name: Build and Test

# Build and test, on pull requests and on `main`.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test-build:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Check for forbidden markers
              uses: HeroicLands/.github/actions/todos@37b1fa7cb6eb63fe6e54531e66a4d0ca61094442 # main
              with:
                  paths: .
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm test
            - run: npm pack --dry-run --json
