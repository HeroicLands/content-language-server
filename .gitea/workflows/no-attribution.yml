name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@d5df169d556decffa602bcfc566f1b391a57ad09 # main
              with:
                  token: ${{ github.token }}
