name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@5d2db91909feba6a8c99013ac15c9a155f066445 # main
              with:
                  token: ${{ github.token }}
