name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@37b1fa7cb6eb63fe6e54531e66a4d0ca61094442 # main
              with:
                  token: ${{ github.token }}
