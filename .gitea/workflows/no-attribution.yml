name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@6ed646d38b0cf4f5eed4a31dcc44bfca2bfd0158 # main
              with:
                  token: ${{ github.token }}
