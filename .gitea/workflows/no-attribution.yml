name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@0bb7fa3d15b9cad324e5c859808de7660998bfe0 # main
              with:
                  token: ${{ github.token }}
