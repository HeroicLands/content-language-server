name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@83bb0cd0af7db952098ef5fe2e8312e7f41040eb # main
              with:
                  token: ${{ github.token }}
