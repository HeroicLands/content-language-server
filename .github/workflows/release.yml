name: Publish to npm

# The only GitHub workflow. GitHub mirrors Gitea, so a `v<version>` tag pushed
# on Gitea arrives here; this workflow publishes that version to npm and cuts
# its GitHub Release. Every check runs on Gitea before the tag exists.
#
# The file name is load-bearing. npm Trusted Publishing binds the publisher to
# the repository `HeroicLands/content-language-server` and the workflow file
# `release.yml`, with no environment. There is no NPM_TOKEN.
on:
    push:
        tags: ["v*"]

permissions:
    # contents: write -> create the GitHub Release
    # id-token: write -> npm Trusted Publishing (OIDC)
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - run: npm publish --provenance

            - name: Create the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  awk '/^## /{c++; if (c>=2) exit; next} c==1{print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
                  gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
