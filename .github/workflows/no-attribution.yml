name: No Attribution

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

jobs:
    no-attribution:
        name: No AI attribution
        runs-on: ubuntu-latest
        steps:
            - uses: HeroicLands/.github/actions/no-attribution@main
              with:
                  token: ${{ github.token }}
