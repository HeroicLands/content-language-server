name: Build and Test

# On GitHub, the push mirror of the Gitea repository, this checks pull requests
# from contributors and nothing else: a mirror push runs nothing here. Gitea
# runs the same job from `.gitea/workflows/build.yml` on pull requests and on
# `main`.
on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test-build:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Check for forbidden markers
              uses: HeroicLands/.github/actions/todos@6ed646d38b0cf4f5eed4a31dcc44bfca2bfd0158 # main
              with:
                  paths: .
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm test
            - run: npm pack --dry-run --json
