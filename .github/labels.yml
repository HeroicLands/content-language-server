# This closed registry is mirrored in ISSUE_REPORTING.md.
- name: documentation
  color: "0075ca"
  description: Documentation and runtime help.
- name: devops
  color: "e07b31"
  description: Build, tooling, CI, release, and repository configuration.
- name: tests
  color: "44e6ce"
  description: Protocol and filesystem tests.
- name: security
  color: "b60205"
  description: Untrusted content, path traversal, and subprocess handling.
- name: tech-debt
  color: "68691b"
  description: Restructuring or cleanup of working code.
- name: regression
  color: "d93f0b"
  description: Behavior that stopped working.
- name: breaking-change
  color: "8d0f09"
  description: Changes to the LSP, CLI, or installation contract.
- name: blocked
  color: "c5702e"
  description: Work waiting on an external dependency or decision.
- name: duplicate
  color: "cfd3d7"
  description: An issue or pull request already tracked elsewhere.
- name: question
  color: "0f5594"
  description: Further information is requested.
- name: wontfix
  color: "ffffff"
  description: Work that will not be pursued.
